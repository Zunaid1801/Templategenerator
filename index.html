<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Petpooja I&T · Email Template Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12213B;
  --ink-soft:#4C5A73;
  --paper:#FBFAF8;
  --panel:#FFFFFF;
  --line:#E4E1DA;
  --accent:#E05A2B;
  --accent-dark:#B8431A;
  --accent-tint:#FDE9DF;
  --good:#2E7D5B;
  --good-tint:#E4F3EC;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Inter', -apple-system, sans-serif;
  --disp: 'Space Grotesk', sans-serif;
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
}
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:100vh;
}
/* Sidebar */
.sidebar{
  background:var(--ink);
  color:#EDE8DF;
  padding:28px 20px 20px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:4px;
}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#F4884A);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;color:#fff;font-size:16px;
  flex-shrink:0;
}
.brand-text{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.01em;}
.brand-sub{
  font-family:var(--mono);font-size:10.5px;color:#9AA6BC;
  letter-spacing:.06em;text-transform:uppercase;margin:2px 0 24px 44px;
}
.nav-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:#7C89A3;margin:6px 0 10px 2px;
}
.nav{
  list-style:none;margin:0;padding:0;
  overflow-y:auto;
  flex:1;
}
.nav li{margin-bottom:2px;}
.nav button{
  width:100%;
  display:flex;align-items:baseline;gap:10px;
  background:none;border:none;
  text-align:left;
  padding:9px 10px;
  border-radius:8px;
  color:#C7CEDD;
  font-family:var(--sans);
  font-size:13px;
  cursor:pointer;
  transition:background .12s ease, color .12s ease;
  line-height:1.35;
}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav button.active{background:var(--accent);color:#fff;}
.nav button .num{
  font-family:var(--mono);font-size:10.5px;color:#7C89A3;flex-shrink:0;width:16px;
}
.nav button.active .num{color:rgba(255,255,255,.75);}
.nav-label-text{display:flex;flex-direction:column;}
.nav-sub{opacity:.6;font-size:11px;}
.sidebar-top{display:flex;align-items:center;justify-content:space-between;}
.mobile-select{display:none;}
.mobile-tabs{display:none;}
.sidebar-foot{
  font-family:var(--mono);font-size:10px;color:#5E6B85;
  padding-top:14px;margin-top:10px;border-top:1px solid rgba(255,255,255,.08);
  line-height:1.6;
}

/* Main */
main{padding:32px 40px 60px;max-width:1400px;}
.head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:24px;margin-bottom:22px;flex-wrap:wrap;
}
.head h1{
  font-family:var(--disp);font-size:26px;margin:0 0 8px;letter-spacing:-.01em;
}
.badges{display:flex;gap:8px;flex-wrap:wrap;}
.badge{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
  padding:5px 10px;border-radius:20px;border:1px solid var(--line);
  color:var(--ink-soft);background:#fff;white-space:nowrap;
}
.badge.audience{border-color:var(--accent-tint);background:var(--accent-tint);color:var(--accent-dark);}

.workspace{
  display:grid;
  grid-template-columns:minmax(360px,440px) 1fr;
  gap:24px;
  align-items:start;
}
@media (max-width:980px){
  .workspace{grid-template-columns:1fr;}
  .app{grid-template-columns:1fr;}
  .sidebar{position:relative;height:auto;}
}

@media (max-width:768px){
  main{padding:18px 14px 100px;}
  .head{margin-bottom:14px;}
  .head h1{font-size:20px;}
  .badges{gap:6px;}
  .badge{font-size:10px;padding:4px 9px;}

  .sidebar{
    padding:12px 14px;
    position:sticky;top:0;z-index:30;
  }
  .brand-sub{margin:2px 0 10px 44px;}
  .nav-label{display:none;}
  .sidebar-foot{display:none;}

  /* On phones, swap the pill nav for a single dropdown — much easier to scan and tap */
  .nav{display:none;}
  .mobile-select{
    display:block;
    width:100%;
    font-family:var(--sans);
    font-weight:600;
    font-size:15px;
    padding:12px 14px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="9" viewBox="0 0 14 9"><path d="M1 1l6 6 6-6" stroke="%23EDE8DF" stroke-width="2" fill="none" fill-rule="evenodd"/></svg>') no-repeat right 14px center;
    color:#fff;
    -webkit-appearance:none;appearance:none;
    min-height:44px;
  }
  .mobile-select option{color:#12213B;background:#fff;}

  /* Tab switcher so people don't have to scroll past the whole form to reach the preview */
  .mobile-tabs{
    display:flex;gap:8px;margin:0 0 14px;
    position:sticky;top:0;z-index:20;
    background:var(--paper);padding:10px 0 8px;
  }
  .mobile-tab{
    flex:1;padding:11px 8px;border-radius:9px;border:1px solid var(--line);
    background:#fff;font-family:var(--sans);font-weight:600;font-size:13px;
    color:var(--ink-soft);cursor:pointer;min-height:44px;
  }
  .mobile-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .workspace{gap:16px;}
  .workspace #formPanel{display:none;}
  .workspace #previewPanel{display:none;}
  .workspace.show-form #formPanel{display:block;}
  .workspace.show-preview #previewPanel{display:block;}
  .panel{padding:16px;border-radius:8px;}
  .field{margin-bottom:14px;}
  .field label{font-size:13px;}
  .field input[type=text],
  .field input[type=date],
  .field input[type=time],
  .field input[type=tel],
  .field select,
  .field textarea{
    font-size:16px; /* prevents iOS Safari auto-zoom on focus */
    padding:12px;
  }
  .check-row{padding:7px 0;}
  .check-row input{width:20px;height:20px;flex-shrink:0;}
  .check-row label{font-size:14px;}
  .row2{grid-template-columns:1fr;}
  .attempt-row{grid-template-columns:1fr 1fr;grid-template-areas:"date time" "result result" "remove remove";gap:6px;}
  .attempt-row input[type=date]{grid-area:date;}
  .attempt-row input[type=time]{grid-area:time;}
  .attempt-row select{grid-area:result;}
  .attempt-row-btns{grid-area:remove;width:100%;}
  .attempt-row-btns .icon-btn{flex:1;width:100%;height:38px;font-size:17px;}
  fieldset{padding:12px;}

  .preview-toolbar{flex-direction:column;align-items:flex-start;}
  .actions{
    position:fixed;left:0;right:0;bottom:0;
    background:#fff;border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(0,0,0,.10);
    z-index:40;gap:8px;width:100%;
  }
  .actions .btn{flex:1;justify-content:center;padding:12px 6px;font-size:12px;white-space:nowrap;min-height:44px;}
  .email-frame{border-radius:8px;}
  .email-body{padding:18px 16px;font-size:13.5px;}
  .email-meta{padding:10px 16px;font-size:10.5px;}
  .details{padding:12px 14px;}
  .details b{min-width:0;display:block;font-size:11px;color:#8A8272;margin-bottom:1px;}
  .details div{margin-bottom:10px;}
  .details div:last-child{margin-bottom:0;}
}

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
}
.panel h2{
  font-family:var(--disp);font-size:14px;margin:0 0 16px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
}
.field{margin-bottom:16px;}
.field:last-child{margin-bottom:0;}
.field label{
  display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ink);
}
.field .hint{font-size:11px;color:var(--ink-soft);font-weight:400;margin-left:6px;}
.field input[type=text],
.field input[type=date],
.field input[type=time],
.field input[type=tel],
.field select,
.field textarea{
  width:100%;
  font-family:var(--sans);
  font-size:13.5px;
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  color:var(--ink);
  transition:border-color .12s ease;
}
.field textarea{resize:vertical;min-height:64px;line-height:1.5;}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);
}
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;}
.check-row input{accent-color:var(--accent);width:15px;height:15px;}
.check-row label{margin:0;font-weight:400;font-size:13px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
fieldset{border:1px dashed var(--line);border-radius:8px;padding:14px;margin:0 0 16px;}
fieldset legend{font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:0 6px;text-transform:uppercase;letter-spacing:.04em;}

/* Preview */
.form-panel-head{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin-bottom:4px;
}
.form-panel-head h2{margin:0;}
.preview-toolbar{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;
}
.preview-toolbar h2{margin:0;}
.actions{display:flex;gap:8px;}
.btn{
  font-family:var(--sans);font-size:12.5px;font-weight:600;
  padding:8px 14px;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;
  transition:transform .08s ease, background .12s ease, border-color .12s ease;
}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff;}

.email-frame{
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;
}
.email-meta{
  background:#F5F3EF;border-bottom:1px solid var(--line);
  padding:12px 20px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);
}
.email-meta div{margin-bottom:3px;}
.email-meta b{color:var(--ink);}
.email-body{padding:26px 28px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.65;color:#222;}
.email-body p{margin:0 0 12px;}
.table-scroll{overflow-x:auto;margin:14px 0;-webkit-overflow-scrolling:touch;}
.email-body table{border-collapse:collapse;width:100%;min-width:360px;margin:0;font-size:12.5px;}
.email-body table th,.email-body table td{border:1px solid #D8D3C8;padding:7px 10px;text-align:left;}
.email-body table th{background:#F5F3EF;}
.email-body ul{margin:6px 0 12px;padding-left:20px;}
.email-body .details{background:#F9F7F3;border:1px solid #E9E4D9;border-radius:6px;padding:14px 16px;margin:12px 0;}
.email-body .details div{margin-bottom:5px;font-size:13.5px;}
.email-body .details b{display:inline-block;min-width:190px;color:#3A3A3A;}
.email-body .note{font-size:11.5px;color:#7A7368;margin-top:2px;}
.email-body .footer-note{font-size:11.5px;color:#7A7368;margin-top:18px;}
.empty-val{color:#B8B2A4;font-style:italic;}
.pill{
  display:inline-block;font-size:10.5px;font-family:var(--mono);
  background:var(--accent-tint);color:var(--accent-dark);padding:2px 8px;border-radius:10px;
}
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:8px;font-size:13px;font-family:var(--sans);
  opacity:0;transform:translateY(8px);transition:all .2s ease;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50;
}
.toast.show{opacity:1;transform:translateY(0);}
.attempts-list{display:flex;flex-direction:column;gap:8px;}
.attempt-row{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:6px;align-items:center;}
.attempt-row input,.attempt-row select{padding:7px 8px;font-size:12.5px;}
.attempt-row-btns{display:flex;gap:4px;}
.icon-btn{
  background:none;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;
  cursor:pointer;color:var(--ink-soft);font-size:15px;line-height:1;flex-shrink:0;
}
.icon-btn[data-act="copy"]:hover{border-color:var(--good);color:var(--good);}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.add-row-btn{
  margin-top:8px;font-family:var(--mono);font-size:11.5px;background:none;border:1px dashed var(--line);
  border-radius:6px;padding:7px 10px;cursor:pointer;color:var(--ink-soft);width:100%;
}
.add-row-btn:hover{border-color:var(--accent);color:var(--accent-dark);}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div class="brand-text">Petpooja</div>
      </div>
    </div>
    <div class="brand-sub">Merchant Training · I&amp;T</div>

    <select class="mobile-select" id="mobileTemplateSelect" aria-label="Choose email template"></select>

    <div class="nav-label">Templates</div>
    <ul class="nav" id="nav"></ul>
    <div class="sidebar-foot">
      Email Template Generator<br>
      Trainer name &amp; signature fields removed — every email now simply closes with "Regards,".
    </div>
  </aside>

  <main>
    <div class="head">
      <div>
        <h1 id="templateTitle">—</h1>
        <div class="badges">
          <span class="badge" id="whenBadge"></span>
          <span class="badge audience" id="audienceBadge"></span>
        </div>
      </div>
    </div>

    <div class="mobile-tabs" id="mobileTabs">
      <button type="button" class="mobile-tab active" data-tab="form">📝 Fill details</button>
      <button type="button" class="mobile-tab" data-tab="preview">✉️ Preview</button>
    </div>

    <div class="workspace">
      <section class="panel" id="formPanel">
        <div class="form-panel-head">
          <h2>Fill details</h2>
          <button class="btn" id="resetBtn" type="button" title="Clear all fields for this template">Reset data</button>
        </div>
        <div id="formFields"></div>
      </section>

      <section id="previewPanel">
        <div class="preview-toolbar">
          <h2 style="font-family:var(--disp);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);">Live preview</h2>
          <div class="actions">
            <button class="btn" id="copyPlainBtn">Copy plain text</button>
            <button class="btn primary" id="copyHtmlBtn">Copy formatted</button>
            <button class="btn" id="downloadBtn">Download .html</button>
          </div>
        </div>
        <div class="email-frame">
          <div class="email-meta">
            <div><b>To:</b> customer@example.com</div>
            <div><b>Subject:</b> <span id="subjectLine"></span></div>
          </div>
          <div class="email-body" id="emailBody"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------
   Petpooja Merchant Training — Email Template Generator
   All templates below are adapted from the training-team's
   communication formats. Trainer / TL "Name & Signature" sign-off
   lines have been removed and replaced with a generic team
   sign-off ("Merchant Training Team").
--------------------------------------------------------------- */

const FEEDBACK_FOOTER = `
<p>We hope the session was informative. For any questions or further assistance, reach us any time on <b>+91 79 6922 3344</b> (available 24×7) or <b>support@petpooja.com</b>. Kindly acknowledge receipt of this email.</p>
<p>We also welcome your feedback — it helps us keep improving our service.<br>Feedback link: <a href="https://forms.gle/XXHMVTV8xxZH3AXg6">https://forms.gle/XXHMVTV8xxZH3AXg6</a></p>`;

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function val(v, placeholder){
  const s = (v===undefined||v===null) ? '' : String(v).trim();
  if(s==='') return `<span style="color:#B0A99A;font-style:italic;font-weight:400;">${esc(placeholder||'—')}</span>`;
  return esc(s);
}
const PILL_STYLE = "display:inline-block;font-size:11px;font-family:'Courier New',Courier,monospace;background:#FDE9DF;color:#B8431A;padding:3px 10px;border-radius:10px;font-weight:600;letter-spacing:.02em;";
function pill(text){ return `<span style="${PILL_STYLE}">${esc(text)}</span>`; }
/* Professional label/value block — fully inline-styled so bold labels + regular
   values survive copy-paste into Gmail/Outlook (external <style>/classes get stripped). */
function dTable(rows){
  const items = rows.filter(Boolean);
  if(!items.length) return '';
  const body = items.map((r,i)=>{
    const last = i===items.length-1;
    const border = last ? '' : 'border-bottom:1px solid #ECE7DC;';
    return `<tr>
      <td style="padding:9px 14px;font-weight:700;color:#12213B;width:220px;vertical-align:top;${border}background:#F4F0E8;font-family:Arial,Helvetica,sans-serif;font-size:13.5px;">${esc(r.label)}</td>
      <td style="padding:9px 14px;font-weight:400;color:#333333;vertical-align:top;${border}background:#FBFAF7;font-family:Arial,Helvetica,sans-serif;font-size:13.5px;">${r.value}</td>
    </tr>`;
  }).join('');
  return `<table role="presentation" cellspacing="0" cellpadding="0" style="border-collapse:collapse;width:100%;margin:14px 0 16px;border:1px solid #E7E2D8;border-radius:8px;overflow:hidden;">${body}</table>`;
}
function greet(){
  return `<p>Dear Customer,</p><p>Greetings from Petpooja!</p>`;
}
function signOff(){
  return `<p>Regards,</p>`;
}
function todayISO(){
  const now = new Date();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  return `${now.getFullYear()}-${mm}-${dd}`;
}

/* ============ Product feature checklists (Training Completed) ============
   Each checklist item is a checkbox in the form: checked = Yes, unchecked = No.
   Defaults below mirror the standard sign-off checklist for each product. */
const CHECKLISTS = {
  'POS': { type:'simple-groups', groups:[
    { title:'POS Check List', color:'#FF0000', headerColor:'#FFFFFF', items:[
      {label:'POS Installation & Setup', default:false},
      {label:'Printer Configuration & Cash Drawer', default:false},
      {label:'Billing & Order Flow', default:false},
      {label:'Operations', default:true},
      {label:'Item Management (POS Menu)', default:true},
      {label:'Inventory & Stock Management', default:false},
      {label:'Reports', default:false},
      {label:'Restaurant Configuration & Logs', default:false},
    ]},
    { title:'Dashboard Check List', color:'#FF0000', headerColor:'#FFFFFF', items:[
      {label:'Main Dashboard View', default:false},
      {label:'Daily Operations', default:false},
      {label:'Menu Management', default:true},
      {label:'Reports', default:true},
      {label:'CRM', default:false},
      {label:'User Management', default:true},
      {label:'Petpooja Agent AI', default:true},
      {label:'Petpooja App & Quick Links Configurations', default:false},
    ]},
  ]},
  'Payroll': { type:'phased', items:[
    {phase:1, topic:'Owner Dashboard & Mobile App', default:true},
    {phase:1, topic:'Biometric Device Intro & Setup', default:true},
    {phase:1, topic:'Device Light Indication', default:true},
    {phase:1, topic:'Wi-Fi Connectivity', default:true},
    {phase:2, topic:'Add Employee (Web & App)', default:true},
    {phase:2, topic:'Biometric Registration', default:true},
    {phase:2, topic:'Shift & Roster Management', default:true},
    {phase:2, topic:'Week Off & Leave Setup', default:true},
    {phase:2, topic:'User Management & Reports', default:true},
    {phase:2, topic:'Payroll Module & Salary Slip', default:true},
    {phase:2, topic:'Owner App Quick Actions', default:true},
    {phase:3, topic:'Employee App Training', default:true},
    {phase:3, topic:'Language Setup', default:false},
    {phase:3, topic:'Leave Apply & Regularisation', default:true},
    {phase:3, topic:'Attendance & Salary Slip Check', default:false},
    {phase:3, topic:'Relogging after Device Change', default:false},
  ]},
  'Purchase': { type:'simple-groups', groups:[
    { title:'Petpooja Purchase', color:'#A9D18E', headerColor:'#000000', items:[
      {label:'Standard Raw Material', default:true},
      {label:'Item/AI Recipe Activated', default:true},
      {label:'Dashboard', default:true},
      {label:'Upload Invoice', default:true},
      {label:'Review Invoice', default:true},
      {label:'Tag Management', default:true},

function resolvedProduct(d){
  return d.product==='Other' ? (d.productOther||'') : (d.product||'');
}
function getChecklistConfig(product){
  return CHECKLISTS[product] || null;
}
function ensureChecklistState(d){
  const product = d.product;
  const cfg = getChecklistConfig(product);
  if(!cfg) return null;
  if(!d._checklist) d._checklist = {};
  if(!d._checklist[product]){
    const s = {};
    if(cfg.type==='simple-groups'){
      cfg.groups.forEach(g=>g.items.forEach(it=>{ s[it.label]=it.default; }));
    } else if(cfg.type==='phased'){
      cfg.items.forEach(it=>{ s[it.topic+'|'+it.phase]=it.default; });
    } else if(cfg.type==='steps'){
      cfg.steps.forEach(st=>st.topics.forEach(top=>{ s[st.step+'::'+top]=false; }));
    }
    d._checklist[product] = s;
  }
  return d._checklist[product];
}
const CL_TABLE = 'border-collapse:collapse;width:100%;margin:14px 0 18px;font-size:12.5px;font-family:Arial,Helvetica,sans-serif;';
const CL_CELL  = 'border:1px solid #999;padding:6px 10px;font-weight:bold;vertical-align:top;';

function buildChecklistHtml(d){
  const cfg = getChecklistConfig(d.product);
  if(!cfg) return '';
  const state = ensureChecklistState(d);
  let html = '';

  if(cfg.type==='simple-groups'){
    cfg.groups.forEach(g=>{
      const bg = g.color || '#FF0000';
      const fg = g.headerColor || '#FFFFFF';
      const itemLabel = g.itemLabel || g.title;
      const statusLabel = g.statusLabel || 'Status';
      html += `<table style="${CL_TABLE}"><tr>
        <th style="${CL_CELL}background:${bg};color:${fg};text-align:left;">${esc(itemLabel)}</th>
        <th style="${CL_CELL}background:${bg};color:${fg};text-align:left;width:80px;">${esc(statusLabel)}</th>
        <th style="${CL_CELL}background:${bg};color:${fg};text-align:left;width:120px;">Remarks</th>
      </tr>`;
      g.items.forEach(it=>{
        html += `<tr>
          <td style="${CL_CELL}">${esc(it.label)}</td>
          <td style="${CL_CELL}">${state[it.label]?'Yes':'No'}</td>
          <td style="${CL_CELL}">&nbsp;</td>
        </tr>`;
      });
      html += `</table>`;
    });
  } else if(cfg.type==='phased'){
    const phaseColors = {1:'#92D050',2:'#00B0F0',3:'#FFC000'};
    html += `<table style="${CL_TABLE}"><tr>
      <th style="${CL_CELL}background:#FFC000;text-align:left;width:40px;">Phase</th>
      <th style="${CL_CELL}background:#FFC000;text-align:left;">Topic</th>
      <th style="${CL_CELL}background:#FFC000;text-align:left;width:80px;">Status</th>
      <th style="${CL_CELL}background:#FFC000;text-align:left;width:120px;">Remarks</th>
    </tr>`;
    let idx = 0;
    while(idx < cfg.items.length){
      const phase = cfg.items[idx].phase;
      let count = 0, j = idx;
      while(j < cfg.items.length && cfg.items[j].phase === phase){ count++; j++; }
      for(let k=0;k<count;k++){
        const it = cfg.items[idx+k];
        const key = it.topic+'|'+it.phase;
        html += `<tr>`;
        if(k===0){
          html += `<td style="${CL_CELL}background:${phaseColors[phase]||'#DDDDDD'};text-align:center;" rowspan="${count}">${phase}</td>`;
        }
        html += `<td style="${CL_CELL}">${esc(it.topic)}</td>
          <td style="${CL_CELL}">${state[key]?'Yes':'No'}</td>
          <td style="${CL_CELL}">&nbsp;</td>
        </tr>`;
      }
      idx = j;
    }
    html += `</table>`;
  } else if(cfg.type==='steps'){
    const stepColors = {
      'Basic Setup':'#00B050',
      'POS & Hardware Setup':'#9DC3E6',
      'Operations & Transactions':'#FFC000',
      'Reports & Monitoring':'#FFFF00',
    };
    html += `<table style="${CL_TABLE}"><tr>
      <th style="${CL_CELL}background:#4472C4;color:#FFFFFF;text-align:left;width:120px;">Step</th>
      <th style="${CL_CELL}background:#4472C4;color:#FFFFFF;text-align:left;">Topics</th>
      <th style="${CL_CELL}background:#4472C4;color:#FFFFFF;text-align:left;width:80px;">Status</th>
      <th style="${CL_CELL}background:#4472C4;color:#FFFFFF;text-align:left;width:120px;">Remarks</th>
    </tr>`;
    cfg.steps.forEach(st=>{
      st.topics.forEach((top,k)=>{
        const key = st.step+'::'+top;
        html += `<tr>`;
        if(k===0){
          html += `<td style="${CL_CELL}background:${stepColors[st.step]||'#DDDDDD'};" rowspan="${st.topics.length}">${esc(st.step)}</td>`;
        }
        html += `<td style="${CL_CELL}">${esc(top)}</td>
          <td style="${CL_CELL}">${state[key]?'Yes':'No'}</td>
          <td style="${CL_CELL}">&nbsp;</td>
        </tr>`;
      });
    });
    html += `</table>`;
  }
  return html;
}

/* ---------- helpers ---------- */
function val_plain(v){ return v ? String(v).trim() : ''; }
function fmtDate(d){
  if(!d) return '';
  const parts = d.split('-');
  if(parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return d;
}
function fmtDateTime(d,t){
  const ds = fmtDate(d);
  if(ds && t) return `${ds}, ${t}`;
  return ds || t || '';
}

/* ---------- state ---------- */
let currentId = TEMPLATES[0].id;
let state = {}; // per-template field values, keyed by templateId

function getData(t){
  if(!state[t.id]) state[t.id] = {};
  const d = state[t.id];
  t.fields.forEach(f=>{
    if(d[f.key]===undefined){
      if(f.type==='checkbox') d[f.key]=f.default||false;
      else if(f.type==='attempts') d[f.key]=[{date:'',time:'',result:''}];
      else if(f.default==='today') d[f.key]=todayISO();
      else d[f.key]=f.default||'';
    }
  });
  return d;
}

/* ---------- render nav ---------- */
const navEl = document.getElementById('nav');
TEMPLATES.forEach((t,i)=>{
  const li = document.createElement('li');
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span><span class="nav-label-text">${t.title}${t.subtitle?`<span class="nav-sub">${t.subtitle}</span>`:''}</span>`;
  btn.dataset.id = t.id;
  btn.addEventListener('click', ()=>selectTemplate(t.id));
  li.appendChild(btn);
  navEl.appendChild(li);
});

/* ---------- mobile template dropdown (mirrors the sidebar nav) ---------- */
const mobileSelect = document.getElementById('mobileTemplateSelect');
TEMPLATES.forEach(t=>{
  const opt = document.createElement('option');
  opt.value = t.id;
  opt.textContent = t.subtitle ? `${t.title} — ${t.subtitle}` : t.title;
  mobileSelect.appendChild(opt);
});
mobileSelect.addEventListener('change', e=>selectTemplate(e.target.value));

function selectTemplate(id){
  currentId = id;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  mobileSelect.value = id;
  renderForm();
  renderPreview();
}

/* ---------- mobile Fill details / Preview tab switcher ---------- */
const workspaceEl = document.querySelector('.workspace');
document.querySelectorAll('.mobile-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.mobile-tab').forEach(b=>b.classList.remove('active'));
    tab.classList.add('active');
    workspaceEl.classList.toggle('show-form', tab.dataset.tab==='form');
    workspaceEl.classList.toggle('show-preview', tab.dataset.tab==='preview');
    window.scrollTo({top:0, behavior:'smooth'});
  });
});
workspaceEl.classList.add('show-form');

/* ---------- render form ---------- */
const formFields = document.getElementById('formFields');
function renderForm(){
  const t = TEMPLATES.find(x=>x.id===currentId);
  document.getElementById('templateTitle').textContent = t.title;
  document.getElementById('whenBadge').textContent = t.when;
  document.getElementById('audienceBadge').textContent = t.audience;

  const d = getData(t);
  formFields.innerHTML = '';

  if(t.fields.length===0){
    formFields.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);">This template has no editable fields — it's a fixed acknowledgement message.</p>`;
    return;
  }

  t.fields.forEach(f=>{
    if(f.showIf && !f.showIf(d)) return;
    const wrap = document.createElement('div');
    wrap.className = 'field';

    if(f.type==='checkbox'){
      wrap.className='check-row';
      wrap.innerHTML = `<input type="checkbox" id="f_${f.key}" ${d[f.key]?'checked':''}><label for="f_${f.key}">${f.label}</label>`;
      wrap.querySelector('input').addEventListener('change', e=>{
        d[f.key]=e.target.checked; renderPreview(); renderForm();
      });
    } else if(f.type==='select'){
      wrap.innerHTML = `<label>${f.label}</label>`;
      const sel = document.createElement('select');
      sel.innerHTML = `<option value="">Select…</option>` + f.options.map(o=>`<option value="${esc(o)}" ${d[f.key]===o?'selected':''}>${esc(o)}</option>`).join('');
      sel.addEventListener('change', e=>{ d[f.key]=e.target.value; renderPreview(); renderForm(); });
      wrap.appendChild(sel);
    } else if(f.type==='textarea'){
      wrap.innerHTML = `<label>${f.label}</label>`;
      const ta = document.createElement('textarea');
      ta.placeholder = f.placeholder||'';
      ta.value = d[f.key];
      ta.addEventListener('input', e=>{ d[f.key]=e.target.value; renderPreview(); });
      wrap.appendChild(ta);
    } else if(f.type==='attempts'){
      wrap.innerHTML = `<label>${f.label}</label>`;
      const list = document.createElement('div');
      list.className='attempts-list';
      d[f.key].forEach((row,idx)=>{
        const r = document.createElement('div');
        r.className='attempt-row';
        r.innerHTML = `
          <input type="date" value="${row.date||''}" data-k="date">
          <input type="time" value="${row.time||''}" data-k="time">
          <select data-k="result">
            <option value="">Result…</option>
            ${['No Answer','Busy','Ringing','Switched Off','Call Declined','Connected'].map(o=>`<option value="${o}" ${row.result===o?'selected':''}>${o}</option>`).join('')}
          </select>
          <div class="attempt-row-btns">
            <button type="button" class="icon-btn" data-act="copy" title="Copy this attempt into a new row">⧉</button>
            <button type="button" class="icon-btn" data-act="remove" title="Remove">×</button>
          </div>
        `;
        r.querySelectorAll('input,select').forEach(inp=>{
          inp.addEventListener('input', ()=>{ row[inp.dataset.k]=inp.value; renderPreview(); });
          inp.addEventListener('change', ()=>{ row[inp.dataset.k]=inp.value; renderPreview(); });
        });
        r.querySelector('[data-act="remove"]').addEventListener('click', ()=>{
          d[f.key].splice(idx,1);
          if(d[f.key].length===0) d[f.key].push({date:'',time:'',result:''});
          renderForm(); renderPreview();
        });
        r.querySelector('[data-act="copy"]').addEventListener('click', ()=>{
          d[f.key].splice(idx+1,0,{date:row.date||'',time:row.time||'',result:row.result||''});
          renderForm(); renderPreview();
        });
        list.appendChild(r);
      });
      wrap.appendChild(list);
      const addBtn = document.createElement('button');
      addBtn.type='button'; addBtn.className='add-row-btn'; addBtn.textContent='+ Add attempt';
      addBtn.addEventListener('click', ()=>{
        const last = d[f.key][d[f.key].length-1];
        const copyFromLast = last && (last.date||last.time||last.result);
        d[f.key].push(copyFromLast ? {date:last.date||'',time:last.time||'',result:last.result||''} : {date:'',time:'',result:''});
        renderForm(); renderPreview();
      });
      wrap.appendChild(addBtn);
    } else {
      wrap.innerHTML = `<label>${f.label}${f.hint?`<span class="hint">${f.hint}</span>`:''}</label>`;
      const inp = document.createElement('input');
      inp.type = f.type;
      inp.placeholder = f.placeholder||'';
      inp.value = d[f.key];
      inp.addEventListener('input', e=>{ d[f.key]=e.target.value; renderPreview(); });
      wrap.appendChild(inp);
    }
    formFields.appendChild(wrap);
  });

  if(getChecklistConfig(d.product)){
    renderChecklistUI(d, formFields);
  }
}

function renderChecklistUI(d, container){
  const cfg = getChecklistConfig(d.product);
  const state = ensureChecklistState(d);
  const fs = document.createElement('fieldset');
  const legend = document.createElement('legend');
  legend.textContent = `${d.product} feature checklist — check = Yes`;
  fs.appendChild(legend);

  const addRow = (parent, key, label)=>{
    const row = document.createElement('div');
    row.className = 'check-row';
    const id = 'cl_'+key.replace(/[^a-zA-Z0-9]+/g,'_');
    row.innerHTML = `<input type="checkbox" id="${id}" ${state[key]?'checked':''}><label for="${id}" style="font-weight:600;">${label}</label>`;
    row.querySelector('input').addEventListener('change', e=>{ state[key]=e.target.checked; renderPreview(); });
    parent.appendChild(row);
  };
  const addHeading = (parent, text)=>{
    const h = document.createElement('div');
    h.style.cssText = 'font-weight:600;font-size:12px;margin:12px 0 6px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;';
    h.textContent = text;
    parent.appendChild(h);
  };

  if(cfg.type==='simple-groups'){
    cfg.groups.forEach(g=>{
      addHeading(fs, g.title);
      g.items.forEach(it=> addRow(fs, it.label, it.label));
    });
  } else if(cfg.type==='phased'){
    let lastPhase = null;
    cfg.items.forEach(it=>{
      if(it.phase!==lastPhase){ addHeading(fs, `Phase ${it.phase}`); lastPhase = it.phase; }
      addRow(fs, it.topic+'|'+it.phase, it.topic);
    });
  } else if(cfg.type==='steps'){
    cfg.steps.forEach(st=>{
      addHeading(fs, st.step);
      st.topics.forEach(top=> addRow(fs, st.step+'::'+top, top));
    });
  }
  container.appendChild(fs);
}

/* ---------- render preview ---------- */
function renderPreview(){
  const t = TEMPLATES.find(x=>x.id===currentId);
  const d = getData(t);
  document.getElementById('subjectLine').textContent = t.subject(d);
  document.getElementById('emailBody').innerHTML = t.render(d);
}

/* ---------- toolbar actions ---------- */
const toast = document.getElementById('toast');
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 1800);
}

document.getElementById('copyHtmlBtn').addEventListener('click', async ()=>{
  const html = document.getElementById('emailBody').innerHTML;
  const plain = document.getElementById('emailBody').innerText;
  try{
    const item = new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([plain], {type:'text/plain'})
    });
    await navigator.clipboard.write([item]);
    showToast('Formatted email copied — paste directly into Gmail/Outlook');
  }catch(e){
    await navigator.clipboard.writeText(plain);
    showToast('Copied as plain text (rich copy unsupported in this browser)');
  }
});

document.getElementById('copyPlainBtn').addEventListener('click', async ()=>{
  const plain = document.getElementById('emailBody').innerText;
  await navigator.clipboard.writeText(plain);
  showToast('Plain text copied to clipboard');
});

document.getElementById('downloadBtn').addEventListener('click', ()=>{
  const t = TEMPLATES.find(x=>x.id===currentId);
  const bodyHtml = document.getElementById('emailBody').innerHTML;
  const subject = document.getElementById('subjectLine').textContent;
  const doc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(subject)}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.65;color:#222;max-width:680px;margin:24px auto;padding:0 16px;}
    table{border-collapse:collapse;width:100%;margin:14px 0;font-size:12.5px;}
    table th,table td{border:1px solid #D8D3C8;padding:7px 10px;text-align:left;}
    table th{background:#F5F3EF;}
    .details{background:#F9F7F3;border:1px solid #E9E4D9;border-radius:6px;padding:14px 16px;margin:12px 0;}
    .details div{margin-bottom:5px;font-size:13.5px;}
    .note{font-size:11.5px;color:#7A7368;}
  </style></head><body>
  <p style="font-size:12px;color:#888;">Subject: ${esc(subject)}</p>
  ${bodyHtml}
  </body></html>`;
  const blob = new Blob([doc], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `petpooja-${t.id}-email.html`;
  a.click();
  showToast('Downloaded .html file');
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  const t = TEMPLATES.find(x=>x.id===currentId);
  if(!confirm(`Clear all entered data for "${t.title}"? This can't be undone.`)) return;
  delete state[t.id];
  renderForm();
  renderPreview();
  showToast('Fields reset for this template');
});

/* ---------- init ---------- */
selectTemplate(TEMPLATES[0].id);
</script>
</body>
</html>
